<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Andrew Mendes - Portfolio</title>

  <script>

      theme: {
        extend: {
          colors: {
            brand: {
              plum: '#381631',
              magenta: '#e21c61',
              coral: '#e26159',
              orange: '#fea85f',
              sage: '#d8dcb4',

              teal: '#1b958d',

      background-color: #381631;

      width: 6px;
      height: 6px;
    }

      background: #381631;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1b958d;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #fea85f;
    }

</head>

    <!-- Tag Filters Section -->

    <!-- Mixed Media Gallery Section -->

  <!-- Lightbox Modal Viewer -->
  <div id="mediaModal" class="fixed inset-0 z-50 bg-[#381631]/95 backdrop-blur-md hidden items-center justify-center p-3 sm:p-6" onclick="handleBackdropClick(event)">
    <div class="relative w-full max-w-2xl bg-[#381631] border border-[#1b958d]/50 rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      
      <!-- Modal Header with Title & Close -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-[#1b958d]/30 bg-[#381631]/80">
        <h3 id="modalTitle" class="text-sm font-semibold text-[#d8dcb4] truncate pr-2"></h3>
        <button onclick="closeModal()" aria-label="Fechar" class="w-8 h-8 rounded-full bg-[#381631] border border-[#1b958d]/40 text-[#d8dcb4] hover:text-[#fea85f] hover:border-[#fea85f] flex items-center justify-center transition-colors shrink-0">
          ✕
        </button>
      </div>

      <!-- Modal Body -->
      <div id="modalBody" class="p-3 sm:p-5 overflow-y-auto flex items-center justify-center custom-scrollbar">
        <!-- Injected dynamically -->
      </div>

    </div>
  </div>

  <!-- Data & Logic -->
  <script>
    // Bilingual dictionary for dynamic swapping
    const i18n = {
      pt: {
        projectsTitle: "Projetos",
        filterHeading: "Filtre por tags:",
        bioSubtitle: "Lápis, pixels, tintas, código, pele, polígonos, uma impressora 3D e um violão. Não necessariamente nessa ordem.",
        all: "Todos",
        tags: {
          Tradicional: "Tradicional",
          Digital: "Digital",
          "2D": "2D",
          "3D": "3D",
          Escultura: "Escultura",
          Tattoo: "Tattoo",
          "Código": "Código",
          "Música": "Música"
        }
      },
      en: {
        projectsTitle: "Projects",
        filterHeading: "Filter by tags:",
        bioSubtitle: "Pencil, pixels, paint, code, skin, polygons, a 3D printer and a guitar. Not necessarily in that order.",
        all: "All",
        tags: {
          Tradicional: "Traditional",
          Digital: "Digital",
          "2D": "2D",
          "3D": "3D",
          Escultura: "Sculpture",
          Tattoo: "Tattoo",
          "Código": "Code",
          "Música": "Music"
        }
      }
    };

    const tagKeys = ["Tradicional", "Digital", "2D", "3D", "Escultura", "Tattoo", "Código", "Música"];

    // Gallery entries with tags, titles, and media handlers
    const galleryItems = [
      {
        id: 1,
        type: "image",
        tags: ["3D", "Digital", "Escultura"],
        title: { pt: "Busto Orc Escultura 3D", en: "Orc Bust 3D Sculpture" },
        src: "GoblygonFront.jpg"
      },
      {
        id: 2,
        type: "image",
        tags: ["Tattoo", "Tradicional", "2D"],
        title: { pt: "Inkalibur Flash Tattoo", en: "Inkalibur Flash Tattoo" },
        src: "inkalibur.jpg"
      },
      {
        id: 3,
        type: "audio",
        tags: ["Música"],
        title: { pt: "Composição Acústica Violão", en: "Acoustic Guitar Track" },
        coverUrl: "questicon.jpg",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        id: 4,
        type: "image",
        tags: ["2D", "Digital"],
        title: { pt: "Games Ever Made Brand", en: "Games Ever Made Brand" },
        src: "GEMLogo_ColorAndWhite_BlackBG_512.png"
      },
      {
        id: 5,
        type: "video",
        tags: ["3D", "Digital"],
        title: { pt: "Timelapse de Modelagem", en: "Sculpting Timelapse" },
        src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        poster: "GoblygonFront.jpg"
      },
      {
        id: 6,
        type: "code",
        tags: ["Código"],
        title: { pt: "CS50 Algoritmo C / Python", en: "CS50 C / Python Algorithm" },
        codeSnippet: `// Frets Spacing Calculator\n#include <stdio.h>\n#include <math.h>\n\nvoid calculate_frets(double scale, int num_frets) {\n    double d = 0;\n    for (int i = 1; i <= num_frets; i++) {\n        d = scale - (scale / pow(2.0, (double)i / 12.0));\n        printf("Fret %2d: %6.2f mm\\n", i, d);\n    }\n}`
      }
    ];

    let currentLang = "pt";
    let activeTag = "all";
    let activeModalItem = null;

    function setLanguage(lang) {
      currentLang = lang;
      
      // Update UI button highlights
      const btnPt = document.getElementById("btn-pt");
      const btnEn = document.getElementById("btn-en");
      if (lang === "pt") {
        btnPt.classList.remove("opacity-60");
        btnPt.classList.add("border-[#fea85f]");
        btnEn.classList.add("opacity-60");
        btnEn.classList.remove("border-[#fea85f]");
      } else {
        btnEn.classList.remove("opacity-60");
        btnEn.classList.add("border-[#fea85f]");
        btnPt.classList.add("opacity-60");
        btnPt.classList.remove("border-[#fea85f]");
      }

      // Update text strings
      document.getElementById("projectsHeading").textContent = i18n[lang].projectsTitle;
      document.getElementById("filterHeading").textContent = i18n[lang].filterHeading;
      document.getElementById("bioSubtitle").textContent = i18n[lang].bioSubtitle;

      // Re-render tags and gallery
      renderTags();
      renderGallery();

      // Update modal title if open
      if (activeModalItem) {
        document.getElementById("modalTitle").textContent = activeModalItem.title[currentLang];
      }
    }

    function renderTags() {
      const container = document.getElementById("tagContainer");
      container.innerHTML = "";

      // 'All' button
      const allBtn = document.createElement("button");
      allBtn.className = `px-3 py-1 rounded-full text-xs font-medium transition-all duration-200 border ${
        activeTag === "all"
          ? "bg-[#fea85f] text-[#381631] border-[#fea85f] font-semibold"
          : "bg-[#381631] text-[#d8dcb4] border-[#1b958d]/40 hover:border-[#fea85f]"
      }`;
      allBtn.textContent = i18n[currentLang].all;
      allBtn.onclick = () => { activeTag = "all"; renderTags(); renderGallery(); };
      container.appendChild(allBtn);

      // Specific tag buttons
      tagKeys.forEach(tagKey => {
        const btn = document.createElement("button");
        const isActive = activeTag === tagKey;
        btn.className = `px-3 py-1 rounded-full text-xs font-medium transition-all duration-200 border ${
          isActive
            ? "bg-[#5eb6ad] text-[#381631] border-[#5eb6ad] font-semibold"
            : "bg-[#381631] text-[#d8dcb4] border-[#1b958d]/40 hover:border-[#5eb6ad]"
        }`;
        btn.textContent = i18n[currentLang].tags[tagKey];
        btn.onclick = () => { activeTag = tagKey; renderTags(); renderGallery(); };
        container.appendChild(btn);
      });
    }

    function renderGallery() {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";

      const filtered = activeTag === "all"
        ? galleryItems
        : galleryItems.filter(item => item.tags.includes(activeTag));

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "group relative aspect-square rounded-xl overflow-hidden bg-[#381631] border border-[#1b958d]/30 hover:border-[#fea85f] transition-all duration-200 cursor-pointer shadow-sm";
        card.onclick = () => openModal(item);

        let innerContent = "";
        const titleText = item.title[currentLang];

        if (item.type === "image") {
          innerContent = `
            <img src="${item.src}" alt="${titleText}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x400/381631/d8dcb4?text=3D+Art';">
          `;
        } else if (item.type === "video") {
          innerContent = `
            <div class="relative w-full h-full bg-[#105390]/40 flex items-center justify-center">
              <img src="${item.poster || 'GoblygonFront.jpg'}" alt="${titleText}" class="w-full h-full object-cover opacity-60" onerror="this.src='https://placehold.co/400x400/105390/d8dcb4?text=Video';">
              <div class="absolute inset-0 flex items-center justify-center">
                <span class="w-10 h-10 rounded-full bg-[#e21c61]/80 group-hover:bg-[#e21c61] text-white flex items-center justify-center pl-0.5 shadow-md transition-colors">▶</span>
              </div>
            </div>
          `;
        } else if (item.type === "audio") {
          innerContent = `
            <div class="relative w-full h-full bg-[#381631] overflow-hidden">
              <img src="${item.coverUrl || 'questicon.jpg'}" alt="${titleText}" class="w-full h-full object-cover opacity-60 group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/400x400/381631/fea85f?text=Audio';">
              <div class="absolute inset-0 bg-gradient-to-t from-[#381631] via-[#381631]/40 to-transparent flex flex-col justify-between p-3">
                <span class="self-end w-7 h-7 rounded-full bg-[#fea85f] text-[#381631] flex items-center justify-center text-xs font-bold shadow">♪</span>
                <div class="flex items-center gap-2">
                  <span class="w-8 h-8 rounded-full bg-[#1b958d] text-white flex items-center justify-center text-xs shadow">▶</span>
                </div>
              </div>
            </div>
          `;
        } else if (item.type === "code") {
          innerContent = `
            <div class="w-full h-full p-3.5 bg-[#381631] flex flex-col justify-between font-mono text-[10px] text-[#5eb6ad] overflow-hidden">
              <div class="text-[9px] uppercase tracking-widest text-[#e21c61] font-bold">SOURCE CODE</div>
              <pre class="opacity-80 line-clamp-4 leading-tight">${item.codeSnippet}</pre>
              <div class="text-[9px] text-[#fea85f]">&lt;/&gt; View Code</div>
            </div>
          `;
        }

        // Overlay with Title Banner
        card.innerHTML = `
          ${innerContent}
          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#381631] via-[#381631]/80 to-transparent p-2.5 pt-6 pointer-events-none">
            <p class="text-xs font-medium text-[#d8dcb4] group-hover:text-[#fea85f] truncate transition-colors">${titleText}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openModal(item) {
      activeModalItem = item;
      const modal = document.getElementById("mediaModal");
      const titleElem = document.getElementById("modalTitle");
      const bodyElem = document.getElementById("modalBody");

      titleElem.textContent = item.title[currentLang];
      bodyElem.innerHTML = "";

      if (item.type === "image") {
        bodyElem.innerHTML = `
          <img src="${item.src}" alt="${item.title[currentLang]}" class="max-h-[75vh] w-auto max-w-full rounded-lg object-contain" onerror="this.src='https://placehold.co/800x800/381631/d8dcb4?text=Image';">
        `;
      } else if (item.type === "video") {
        bodyElem.innerHTML = `
          <video controls autoplay class="w-full max-h-[75vh] rounded-lg bg-black">
            <source src="${item.src}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
      } else if (item.type === "audio") {
        bodyElem.innerHTML = `
          <div class="flex flex-col items-center gap-4 w-full max-w-md py-4">
            <img src="${item.coverUrl || 'questicon.jpg'}" alt="Cover" class="w-48 h-48 rounded-xl object-cover shadow-lg border border-[#1b958d]/40" onerror="this.src='https://placehold.co/400x400/381631/fea85f?text=Track';">
            <audio controls autoplay class="w-full mt-2">
              <source src="${item.src}" type="audio/mpeg">
              Your browser does not support the audio element.
            </audio>
          </div>
        `;
      } else if (item.type === "code") {
        bodyElem.innerHTML = `
          <div class="w-full">
            <pre class="bg-[#381631] p-4 rounded-xl text-xs font-mono text-[#5eb6ad] border border-[#1b958d]/40 overflow-x-auto custom-scrollbar"><code>${item.codeSnippet.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
          </div>
        `;
      }

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("mediaModal");
      const bodyElem = document.getElementById("modalBody");
      
      // Stop media playback
      const media = bodyElem.querySelector("video, audio");
      if (media) media.pause();

      modal.classList.add("hidden");
      modal.classList.remove("flex");
      bodyElem.innerHTML = "";
      activeModalItem = null;
    }

    function handleBackdropClick(event) {
      if (event.target.id === "mediaModal") closeModal();
    }

    // Dismiss on Escape key
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // Initialize page
    setLanguage("pt");
  </script>
</body>
</html>
